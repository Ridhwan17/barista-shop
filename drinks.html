<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drinks page</title>
</head>
<body>
    <!-- !============header=====================-->
    <header>
        <div class="container">
            <!-- ?logo area-->
            <div class="logo-area">
                <a href="index.html">WanPLus</a>
            </div>

            <!-- ?food button-->
            <div class="food-button">
                <a href="food.html" class="food-button">Food</a>
            </div>
        </div>
    </header>
    
    <main>
        <!-- !===============menu header================-->
        <section class="menu-header">
            <div class="container">
                <h1>Explore the coffee world</h1>
            </div>
        </section>

        <!-- !=============== menu card ================-->
        <section class="menu-section">
            <div class="container">
                <div class="menu-grid">
                    <!-- ?================= menu card ==========================-->
                    
                    <!-- *drink 1 -->
                    <article class="drink-card">
                        <img src="images/coffee/biscoff.jpg" alt="biscoff">

                        <!-- ? drink description-->
                        <div class="drink-info">
                            <div class="drink-description">
                                <h2>Biscoff latte</h2>
                                <p>Latte combined with Biscoff deliver a perfect sweetness</p>
                            </div>

                            <!-- ? price and order button-->
                            <div class="drink-bottom">
                                <span class="drink-price">
                                    $8.90
                                </span>

                                <button class="order-button">Order now</button>
                            </div>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
